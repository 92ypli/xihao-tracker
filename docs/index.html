<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>喜好跟踪</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
    --up:#ef4444; --down:#22c55e; --accent:#38bdf8; --warn:#fbbf24;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0 auto;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:12px 12px calc(40px + env(safe-area-inset-bottom));max-width:860px;
  }
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .up{color:var(--up)} .down{color:var(--down)}
  .small{font-size:12px}
  .tiny{font-size:11px}
  h1{font-size:18px;margin:0 0 2px}
  h2{font-size:15px;margin:0 0 12px;font-weight:600}
  h3{font-size:13px;margin:16px 0 8px;font-weight:600;color:var(--muted)}
  .big{font-size:34px;font-weight:700}
  .metrics{display:flex;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .metric{width:33.33%;margin-bottom:8px}
  .metric .k{display:block;font-size:11px;color:var(--muted)}
  .metric .v{display:block;font-size:15px;margin-top:2px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer}
  .tab.on{color:#0f172a;background:var(--accent);font-weight:600}
  .sepline{width:1px;background:var(--line);margin:0 2px;align-self:stretch}
  .item{border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
  .item:last-child{border-bottom:none}
  .item.focus{background:linear-gradient(90deg,rgba(56,189,248,.09),transparent)}
  .name{font-size:15px;font-weight:600}
  .code{font-size:12px;color:var(--dim);margin-left:8px}
  .mtag{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;border:1px solid var(--dim);color:var(--muted)}
  .mtag.hk{border-color:#a78bfa;color:#a78bfa}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;color:#0f172a;white-space:nowrap}
  .badge.buy{background:var(--up)} .badge.hold{background:#64748b;color:#f1f5f9}
  .badge.trim{background:var(--down)} .badge.na{background:#334155;color:var(--muted)}
  .price{font-size:17px;font-weight:600}
  .line2{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .line3{margin-top:6px;font-size:12px;color:var(--muted)}
  .hl{color:var(--text)}
  .sep{margin:0 8px;color:var(--line)}
  .detail{background:#16233a;border-radius:12px;padding:14px;margin:4px 0 10px;font-size:13px}
  .bars{display:flex;gap:10px;margin-bottom:12px}
  .band{flex:1;background:var(--bg);border-radius:10px;padding:12px;border-left:4px solid var(--dim)}
  .band.buy{border-left-color:var(--up)} .band.trim{border-left-color:var(--down)}
  .band .k{font-size:11px;color:var(--muted)}
  .band .v{font-size:22px;font-weight:700;margin:2px 0}
  .band.buy .v{color:var(--up)} .band.trim .v{color:var(--down)}
  .band .s{font-size:11px;color:var(--dim);line-height:1.5}
  .bar{position:relative;display:flex;height:10px;margin:18px 0 6px}
  .zone{height:10px}
  .zone.buy{width:30%;background:var(--up);border-radius:999px 0 0 999px}
  .zone.hold{width:40%;background:#475569}
  .zone.trim{width:30%;background:var(--down);border-radius:0 999px 999px 0}
  .cursor{position:absolute;top:-5px;width:2px;height:20px;background:#fff;border-radius:1px}
  .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  .doc{padding:8px 0;border-bottom:1px solid var(--line)}
  .doc:last-child{border-bottom:none}
  .doc a{color:var(--text);text-decoration:none}
  .org{color:var(--accent);font-size:12px}
  .warnbox{border-left:4px solid var(--warn);background:#16233a;border-radius:10px;padding:12px;font-size:13px;margin-bottom:10px}
  .warnbox .w{color:var(--warn);line-height:1.7}
  .cat{display:flex;padding:8px 0;border-bottom:1px solid var(--line)}
  .cat:last-child{border-bottom:none}
  .cat .l{width:92px;flex-shrink:0}
  .cat .d{color:var(--accent);font-weight:600}
  .lic{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lic:last-child{border-bottom:none}
  .lic .pd{font-weight:600}
  .tagline{display:inline-block;font-size:10px;background:#0f172a;color:var(--accent);border-radius:4px;padding:1px 5px;margin-right:4px}
  .soon{border-left:3px solid var(--warn);padding-left:8px}
  .prod{padding:10px 0;border-bottom:1px solid var(--line)}
  .prod:last-child{border-bottom:none}
  .prod-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .prod-name{font-weight:600;font-size:14px}
  .chip{font-size:10px;padding:1px 7px;border-radius:999px;background:#0f172a;color:var(--muted);border:1px solid var(--line)}
  .chip.testing{color:var(--warn);border-color:var(--warn)}
  .chip.live{color:var(--accent);border-color:var(--accent)}
  .score{font-size:13px;font-weight:700;color:var(--warn)}
  .score.good{color:var(--down)}
  .score.bad{color:var(--up)}
  .prod-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
  .prod-meta{font-size:11px;color:var(--dim);margin-top:3px}
  .empty-hint{font-size:12px;color:var(--dim);line-height:1.7;background:#0f172a;border-radius:8px;padding:10px}
  .macro-grid{display:flex;flex-wrap:wrap;margin:10px 0 0}
  .macro-item{width:50%;margin-bottom:10px;font-size:13px}
  .macro-item .n{color:var(--muted);font-size:11px;display:block}
  .macro-item .v{font-size:15px}
  .macro-verdict{border-radius:10px;padding:12px;margin-top:8px;font-size:13px;line-height:1.7}
  .macro-verdict.warn{background:rgba(251,191,36,.08);border-left:4px solid var(--warn)}
  .macro-verdict.good{background:rgba(34,197,94,.08);border-left:4px solid var(--down)}
  .macro-verdict.flat{background:#0f172a;border-left:4px solid var(--dim)}
  .macro-verdict .item{color:var(--muted);border:none;padding:2px 0;cursor:default}
  .foot{text-align:center;font-size:11px;color:var(--dim);line-height:1.7;margin-top:20px}
  .empty{color:var(--muted);font-size:13px}
  .locklink{color:var(--dim);text-decoration:underline;cursor:pointer}

  /* 密码门 */
  #gate{display:none;min-height:80vh;align-items:center;justify-content:center}
  #gate.show{display:flex}
  .gate-box{width:100%;max-width:360px;text-align:center}
  .gate-box .logo{font-size:22px;font-weight:700;margin-bottom:6px}
  .gate-box .sub{color:var(--muted);font-size:12px;margin-bottom:24px}
  .gate-input{
    width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:16px;outline:none;
  }
  .gate-input:focus{border-color:var(--accent)}
  .gate-btn{
    width:100%;margin-top:12px;padding:13px;border-radius:12px;border:none;
    background:var(--accent);color:#0f172a;font-size:15px;font-weight:600;cursor:pointer;
  }
  .gate-btn:disabled{opacity:.6}
  .gate-err{color:var(--up);font-size:13px;margin-top:12px;min-height:20px}
  .gate-hint{color:var(--dim);font-size:11px;margin-top:20px;line-height:1.7}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(15,23,42,.3);
    border-top-color:#0f172a;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="logo">喜好跟踪</div>
    <div class="sub">需要密码才能查看</div>
    <input id="pw" class="gate-input" type="password" placeholder="输入密码"
           autocomplete="current-password" enterkeyhint="go">
    <button id="go" class="gate-btn">进入</button>
    <div id="err" class="gate-err"></div>
    <div class="gate-hint">密码只保存在这台设备上，不会上传。<br>忘记了就重新设置一个，明天的新数据会用它加密。</div>
  </div>
</div>

<script>
(function(){
  var STORE_KEY = "xihao_pw";
  var payload;
  try {
    payload = JSON.parse(document.getElementById("payload").textContent);
  } catch (e) {
    document.body.innerHTML =
      '<div class="card" style="text-align:center;padding:36px 20px">'
      + '<div style="font-size:17px;font-weight:600;margin-bottom:10px">页面没加载完整</div>'
      + '<div class="muted small" style="margin-bottom:20px;line-height:1.8">'
      + '数据在传输中被截断了。<br>重新加载一次通常就好。</div>'
      + '<button id="retry" style="width:100%;max-width:260px;padding:12px;border-radius:12px;'
      + 'border:none;background:#38bdf8;color:#0f172a;font-size:15px;font-weight:600">重新加载</button>'
      + '<div class="dim tiny" style="margin-top:20px;line-height:1.8">'
      + '如果反复出现，点右上角 ⋯ → 用系统浏览器打开。<br>微信内置浏览器对长页面不太稳。</div>'
      + '</div>';
    var rb = document.getElementById("retry");
    if (rb) rb.addEventListener("click", function(){ location.reload(); });
    return;
  }

  /* ---------- 解密 ---------- */

  function b64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(pw){
    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("当前浏览器不支持解密，请用系统自带浏览器（Safari / Chrome）打开");
    }
    var raw = b64ToBytes(payload.data);
    var sl = payload.saltLen || 16, il = payload.ivLen || 12;
    var salt = raw.slice(0, sl);
    var iv = raw.slice(sl, sl + il);
    var ct = raw.slice(sl + il);
    var material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: salt, iterations: payload.iter || 250000, hash:"SHA-256" },
      material, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* ---------- 密码门 ---------- */

  var gate = document.getElementById("gate");
  var appEl = document.getElementById("app");
  var input = document.getElementById("pw");
  var btn = document.getElementById("go");
  var errEl = document.getElementById("err");

  function showGate(msg){
    gate.classList.add("show");
    appEl.style.display = "none";
    if (msg) errEl.textContent = msg;
    try { input.focus(); } catch(e){}
  }

  async function unlock(pw, remember){
    btn.disabled = true;
    errEl.textContent = "";
    btn.innerHTML = '<span class="spin"></span>解密中…';
    try {
      var snap = await decrypt(pw);
      if (remember) { try { localStorage.setItem(STORE_KEY, pw); } catch(e){} }
      gate.classList.remove("show");
      appEl.style.display = "";
      start(snap);
    } catch (e) {
      var msg = /OperationError|decrypt/i.test(String(e && e.message))
        ? "密码不对"
        : (e && e.message) || "解密失败";
      try { localStorage.removeItem(STORE_KEY); } catch(_){}
      showGate(msg);
    } finally {
      btn.disabled = false;
      btn.textContent = "进入";
    }
  }

  btn.addEventListener("click", function(){ unlock(input.value, true); });
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(input.value, true); });

  /* ---------- 渲染 ---------- */

  function start(snap){
  var focus = snap.focus || [];
  var hkFocus = snap.hkFocus || [];
  var catalysts = snap.catalysts || {};
  var sort = "pct", filter = "all", openKey = null;

  function f2(v){ return (v==null||isNaN(v)) ? "-" : Number(v).toFixed(2); }
  function f3(v){ return (v==null||isNaN(v)) ? "-" : Number(v).toFixed(3); }
  function px(v,m){ if(v==null||isNaN(v))return "-"; return m==="HK" ? (Math.abs(v)<10?f3(v):f2(v)) : f2(v); }
  function pe(s){ var v = s.peTtm!=null?s.peTtm:s.peDyn; return v==null||isNaN(v)?"-":Number(v).toFixed(1); }
  function fp(v){ return (v==null||isNaN(v)) ? "-" : Number(v).toFixed(1)+"%"; }
  function sg(v){ return (v==null||isNaN(v)) ? "-" : (v>0?"+":"")+Number(v).toFixed(2); }
  function cap(v){ return v ? (v/1e8).toFixed(0)+"亿" : "-"; }
  function big(v){
    if (v == null || isNaN(v)) return "-";
    if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(1)+"亿";
    if (Math.abs(v) >= 1e4) return (v/1e4).toFixed(1)+"万";
    return String(Math.round(v));
  }
  function tone(v){ return v>0?"up":v<0?"down":""; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function decorate(s){
    var v = s.valuation || {};
    return {
      key:(s.market||"A")+s.code, code:s.code, name:s.name, market:s.market||"A",
      price:s.price, chgPct:s.chgPct, peTtm:s.peTtm, peDyn:s.peDyn, pb:s.pb,
      totalCap:s.totalCap, pct: v.ok ? v.compositePct : null,
      pePct:v.pePct, pbPct:v.pbPct, psPct:v.psPct, method:v.method||"valuation",
      bands:s.bands, status:s.status, valuation:v, consensus:s.consensus,
      priceContext:s.priceContext, invalids:s.invalidations||[],
      isFocus: focus.indexOf(s.code)>=0 || hkFocus.indexOf(s.code)>=0,
      isHk: s.market==="HK"
    };
  }

  function sortFn(a,b){
    if (a.isFocus !== b.isFocus) return a.isFocus ? -1 : 1;
    if (sort === "chg") return (b.chgPct||0)-(a.chgPct||0);
    if (sort === "cap") return (b.totalCap||0)-(a.totalCap||0);
    return (a.pct==null?999:a.pct)-(b.pct==null?999:b.pct);
  }

  function pass(s){
    if (filter === "focus") return s.isFocus;
    if (filter === "A") return !s.isHk;
    if (filter === "HK") return s.isHk;
    if (filter === "low") return s.pct != null && s.pct < 30;
    if (filter === "high") return s.pct != null && s.pct > 70;
    return true;
  }

  function methodLabel(m){ return m==="price" ? "价格分位" : "估值分位"; }

  function detailHtml(s){
    var d = {};
    if (!s.isHk) d = (snap.details||{})[s.code] || {};
    var h = ['<div class="detail">'];

    if (s.bands) {
      h.push('<div class="bars">');
      h.push('<div class="band buy"><div class="k">加仓价</div><div class="v">'+px(s.bands.addPrice,s.market)+'</div>'
        +'<div class="s">低于此价进入低位区<br>区间 '+px(s.bands.addLow,s.market)+' ~ '+px(s.bands.addHigh,s.market)+'</div></div>');
      h.push('<div class="band trim"><div class="k">减仓价</div><div class="v">'+px(s.bands.trimPrice,s.market)+'</div>'
        +'<div class="s">高于此价进入高位区<br>区间 '+px(s.bands.trimLow,s.market)+' ~ '+px(s.bands.trimHigh,s.market)+'</div></div>');
      h.push('</div>');
      h.push('<div class="legend"><span>距加仓价 '+sg(s.bands.toAddPricePct)+'%</span><span>距减仓价 '+sg(s.bands.toTrimPricePct)+'%</span></div>');
    } else {
      h.push('<div class="empty">区间：'+esc(s.valuation.reason||"数据不足")+'</div>');
    }

    if (s.pct != null) {
      h.push('<div class="bar"><div class="zone buy"></div><div class="zone hold"></div><div class="zone trim"></div>'
        +'<div class="cursor" style="left:'+Math.max(0,Math.min(100,s.pct))+'%"></div></div>');
      h.push('<div class="legend"><span>低位区</span><span>中间区</span><span>高位区</span></div>');
    }

    h.push('<div class="metrics">');
    h.push('<div class="metric"><span class="k">区间口径</span><span class="v">'+methodLabel(s.method)+'</span></div>');
    h.push('<div class="metric"><span class="k">PE</span><span class="v">'+pe(s)+'</span></div>');
    h.push('<div class="metric"><span class="k">PB</span><span class="v">'+(s.pb==null?"-":Number(s.pb).toFixed(2))+'</span></div>');
    h.push('</div>');

    if (s.method === "valuation") {
      h.push('<div class="metrics">');
      h.push('<div class="metric"><span class="k">PE 分位</span><span class="v">'+fp(s.pePct)+'</span></div>');
      h.push('<div class="metric"><span class="k">PB 分位</span><span class="v">'+fp(s.pbPct)+'</span></div>');
      h.push('<div class="metric"><span class="k">PS 分位</span><span class="v">'+fp(s.psPct)+'</span></div>');
      h.push('</div>');
    }

    if (s.consensus && s.consensus.count) {
      var c = s.consensus;
      h.push('<div class="metrics">');
      h.push('<div class="metric"><span class="k">覆盖报告</span><span class="v">'+c.count+' 篇</span></div>');
      h.push('<div class="metric"><span class="k">今年 EPS</span><span class="v">'+(c.epsThisYear||"-")+'</span></div>');
      h.push('<div class="metric"><span class="k">明年 EPS</span><span class="v">'+(c.epsNextYear||"-")+'</span></div>');
      h.push('<div class="metric"><span class="k">今年预测 PE</span><span class="v">'+(c.peOnThisYear||"-")+'</span></div>');
      h.push('<div class="metric"><span class="k">明年预测 PE</span><span class="v">'+(c.peOnNextYear||"-")+'</span></div>');
      h.push('<div class="metric"><span class="k">预测趋势</span><span class="v">'
        + ({up:"上调",down:"下调",flat:"持平"}[c.revTrend]||"-")+'</span></div>');
      h.push('</div>');
    }

    var pc = s.priceContext;
    if (pc) {
      h.push('<div class="metrics">');
      h.push('<div class="metric"><span class="k">近3年分位</span><span class="v">'+fp(pc.pricePct)+'</span></div>');
      h.push('<div class="metric"><span class="k">季线 MA60</span><span class="v">'+px(pc.ma60,s.market)+'</span></div>');
      h.push('<div class="metric"><span class="k">年线 MA250</span><span class="v">'+px(pc.ma250,s.market)+'</span></div>');
      h.push('<div class="metric"><span class="k">250日低</span><span class="v">'+px(pc.low250,s.market)+'</span></div>');
      h.push('<div class="metric"><span class="k">250日高</span><span class="v">'+px(pc.high250,s.market)+'</span></div>');
      h.push('</div>');
    }

    if (s.invalids.length) {
      h.push('<div class="warnbox"><b>区间失效条件</b>');
      for (var i=0;i<s.invalids.length;i++) h.push('<div class="w">· '+esc(s.invalids[i])+'</div>');
      h.push('</div>');
    }

    if (d.announcements && d.announcements.length) {
      h.push('<h3>公告</h3>');
      for (var j=0;j<d.announcements.length;j++){
        var a = d.announcements[j];
        h.push('<div class="doc"><span class="dim tiny">'+a.date+'</span><br><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a></div>');
      }
    }
    if (d.reports && d.reports.length) {
      h.push('<h3>机构报告</h3>');
      for (var k=0;k<Math.min(6,d.reports.length);k++){
        var r = d.reports[k];
        h.push('<div class="doc"><span class="dim tiny">'+r.date+'</span> <span class="org">'+esc(r.org)+'</span><br>'
          +'<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.title)+'</a></div>');
      }
    }
    if (s.isHk) {
      h.push('<div class="tiny dim" style="margin-top:10px">港股没有免费的历史估值数据，区间由近 5 年价格分位反推，与 A 股的估值分位口径不同，两者不可直接比较。</div>');
    }
    h.push(productHtml(s.code));
    h.push('</div>');
    return h.join("");
  }

  function scoreClass(v){
    if (v == null) return "";
    if (v >= 8) return "good";
    if (v < 6) return "bad";
    return "";
  }

  function productHtml(code){
    var all = (snap.profiles && snap.profiles.companies) || {};
    var prof = all[code];
    if (!prof || !prof.products || !prof.products.length) {
      return '<h3>产品档案</h3><div class="empty-hint">这家公司还没有填产品档案。'
        + '在 <b>config/profiles.json</b> 里补上，填产品名和 TapTap 链接，'
        + '评分、好评率、评价数、上线时间、在测状态都会自动抓。</div>';
    }
    var h = ['<h3>产品档案</h3>'];
    if (prof.note) h.push('<div class="prod-note" style="margin-bottom:8px">'+esc(prof.note)+'</div>');

    var up = prof.products.filter(function(p){ return p.upcoming; });
    var live = prof.products.filter(function(p){ return !p.upcoming; });

    function row(p){
      var cls = p.status === "测试中" ? "testing" : (p.status === "已上线" || p.status === "运营中" ? "live" : "");
      var t = p.tap;
      var meta = [];
      if (t) {
        meta.push('<span class="score '+scoreClass(t.score)+'">TapTap '+(t.score==null?"-":t.score)+(t.maxScore&&t.maxScore!==10?"/"+t.maxScore:"")+'</span>');
        if (t.goodRate != null) meta.push('好评率 '+t.goodRate+'%');
        if (t.reviewCount) meta.push(t.reviewCount+' 条评价');
        if (t.labels && t.labels.length) meta.push('状态：'+t.labels.join('/'));
        if (t.reserveCount) meta.push('预约 <b>'+big(t.reserveCount)+'</b>');
        if (t.fansCount) meta.push('关注 '+big(t.fansCount));
        var house = t.publisher || t.developer;
        if (house) meta.push('TapTap 厂商：'+house);
      } else if (p.tapError) {
        meta.push('TapTap 抓取失败');
      } else if (p.taptap) {
        meta.push('TapTap id 无效');
      }
      if (p.launchDate) meta.push('上线 '+p.launchDate+(p.monthsLive!=null?'（'+p.monthsLive+' 个月）':''));
      var tr = p.trend;
      if (tr && tr.since) {
        var d = [];
        var signedBig = function(v){ return (v>0?'+':'-') + big(Math.abs(v)); };
        if (tr.reserveDelta) d.push('预约 '+signedBig(tr.reserveDelta));
        if (tr.fansDelta) d.push('关注 '+signedBig(tr.fansDelta));
        if (tr.scoreDelta) d.push('评分 '+sg(tr.scoreDelta));
        if (tr.reviewDelta) d.push('评价 '+sg(tr.reviewDelta));
        if (d.length) meta.push('较 '+tr.since+'：'+d.join('、'));
      }
      if (p.expectedDate) {
        meta.push('预期 '+p.expectedDate+(p.daysAway!=null?'（'+(p.daysAway>=0?p.daysAway+' 天后':'已过 '+(-p.daysAway)+' 天')+'）':''));
      } else if (p.upcoming) {
        meta.push('时间待定');
      }

      var warn = p.verify === "mismatch"
        ? '<div class="prod-note" style="color:var(--warn)">⚠ TapTap 上的厂商名和这家公司的名字对不上，归属需要你复核一下</div>'
        : '';
      return '<div class="prod'+(p.soonDays!=null?' soon':'')+'">'
        + '<div class="prod-top"><span class="prod-name">'+esc(p.name)+'</span>'
        + (p.type?'<span class="chip">'+esc(p.type)+'</span>':'')
        + (p.status?'<span class="chip '+cls+'">'+esc(p.status)+'</span>':'')
        + (t?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener" class="chip">TapTap ↗</a>':'')
        + '</div>'
        + (meta.length?'<div class="prod-meta">'+meta.join(' · ')+'</div>':'')
        + (p.note?'<div class="prod-note">'+esc(p.note)+'</div>':'')
        + warn
        + '</div>';
    }

    if (up.length) {
      h.push('<div class="small dim" style="margin:8px 0 2px">在测 / 待上线</div>');
      for (var i=0;i<up.length;i++) h.push(row(up[i]));
    }
    if (live.length) {
      h.push('<div class="small dim" style="margin:12px 0 2px">代表产品</div>');
      for (var j=0;j<live.length;j++) h.push(row(live[j]));
    }
    return h.join("");
  }

  function catalystHtml(){
    var h = ['<div class="card"><h2>催化剂</h2>'];
    var any = false;

    var lic = catalysts.license;
    if (lic && lic.ok && lic.months && lic.months.length) {
      any = true;
      var latest = lic.months[0];
      h.push('<h3>版号公示　<span class="small dim">'+esc(latest.title)+'　'+latest.publishDate+'　共 '+(latest.total||"-")+' 款</span></h3>');
      var ms = lic.matched || [];
      if (!ms.length) {
        h.push('<div class="empty">最近公示里没有匹配到跟踪范围的公司</div>');
      } else {
        for (var i=0;i<ms.length;i++){
          var m = ms[i];
          h.push('<div class="lic"><div style="width:76px;flex-shrink:0" class="dim small">'+m.date.slice(5)+'</div>'
            +'<div><span class="pd">《'+esc(m.name)+'》</span>'
            +(m.companyName?' <span class="org">'+esc(m.companyName)+'</span>':'')
            +'<div class="tiny dim">'+esc(m.matchedField)+'：'+esc(m.matchedEntity)+'</div></div></div>');
        }
      }
    }

    var pipe = catalysts.pipeline || [];
    if (pipe.length) {
      any = true;
      h.push('<h3>产品管线　<span class="small dim">人工维护，改 config/pipeline.json</span></h3>');
      for (var p=0;p<pipe.length;p++){
        var it = pipe[p];
        var when = it.expectedDate==null ? "时间待定"
          : (it.daysAway==null ? it.expectedDate
            : it.expectedDate+'（'+(it.daysAway>=0? it.daysAway+' 天后' : '已过 '+(-it.daysAway)+' 天')+'）');
        h.push('<div class="lic '+(it.soon?'soon':'')+'"><div style="width:76px;flex-shrink:0" class="dim small">'
          +esc(it.stage||"")+'</div><div><span class="pd">'+esc(it.product)+'</span>'
          +(it.companyName?' <span class="org">'+esc(it.companyName)+'</span>':'')
          +'<div class="tiny dim">'+esc(when)+(it.note?'　'+esc(it.note):'')+'</div></div></div>');
      }
    }

    var hl = catalysts.highlights || [];
    if (hl.length) {
      any = true;
      h.push('<h3>近期动态　<span class="small dim">标题关键词扫描</span></h3>');
      for (var q=0;q<Math.min(10,hl.length);q++){
        var x = hl[q];
        h.push('<div class="doc"><span class="dim tiny">'+x.date+'</span> <span class="tagline">'+esc(x.kind)+'</span>'
          +'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a>'
          +(x.tags&&x.tags.length?'<div class="tiny dim">命中：'+esc(x.tags.join(" / "))+'</div>':'')+'</div>');
      }
    }

    var cal = catalysts.calendar || [];
    if (cal.length) {
      any = true;
      h.push('<h3>日程提醒</h3>');
      for (var c=0;c<cal.length;c++){
        var k2 = cal[c];
        h.push('<div class="cat"><div class="l"><div class="d">'+(k2.daysAway===0?"今天":k2.daysAway+" 天后")+'</div>'
          +'<div class="dim tiny">'+k2.date+'</div></div>'
          +'<div><div>'+esc(k2.title)+'</div><div class="dim tiny">'+esc(k2.note)+'</div></div></div>');
      }
    }

    if (!any) h.push('<div class="empty">暂无</div>');
    h.push('</div>');
    return h.join("");
  }

  function macroHtml(){
    var m = snap.macro;
    if (!m || !m.ok || !m.items || !m.items.length) return '';
    var h = ['<div class="card"><h2>隔夜外盘与风险背景</h2>'];
    h.push('<div class="macro-grid">');
    for (var i=0;i<m.items.length;i++){
      var x = m.items[i];
      h.push('<div class="macro-item"><span class="n">'+esc(x.label)+'</span>'
        + '<span class="v '+tone(x.chgPct)+'">'+fmtIdx(x.price)
        + (x.chgPct!=null ? ' <span class="small">'+sg(x.chgPct)+'%</span>' : '')
        + '</span></div>');
    }
    h.push('</div>');

    var bg = m.background || {};
    h.push('<div class="macro-verdict '+(bg.toneLevel||'flat')+'">');
    h.push('<b>背景判断：'+esc(bg.tone||'-')+'</b>');
    for (var j=0;j<(bg.signals||[]).length;j++){
      var s = bg.signals[j];
      h.push('<div class="item">· '+esc(s.text)+'</div>');
    }
    h.push('</div>');
    h.push('<div class="tiny dim" style="margin-top:12px;line-height:1.8">'
      + '这是<strong>环境描述</strong>，不是涨跌预测。规则写死在 src/macro.mjs 里，'
      + '你可以看、可以改、可以事后核对对错。日频涨跌接近随机，任何预测都不足以支撑交易决策。'
      + '</div>');
    h.push('</div>');
    return h.join("");
  }

  function fmtIdx(v){
    if (v == null || isNaN(v)) return '-';
    if (Math.abs(v) >= 100) return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
    return Number(v).toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
  }

  function render(){
    var s = snap.sector, idx = s.index;
    var hk = (snap.hkStocks||[]).map(decorate);
    var all = snap.stocks.map(decorate).concat(hk).sort(sortFn).filter(pass);
    var h = [];

    h.push('<div class="card">');
    h.push('<div class="row between"><div><h1>喜好跟踪</h1>'
      + '<span class="small dim">'+snap.tradeDate+'</span></div>'
      + '<span class="small dim">'+new Date(snap.generatedAt).toLocaleString("zh-CN")+'</span></div>');
    h.push('<div class="row wrap" style="align-items:baseline;gap:12px;margin-top:10px">'
      + '<span class="big '+tone(idx.chgPct)+'">'+f2(idx.price)+'</span>'
      + '<span class="'+tone(idx.chgPct)+'">'+(sg(idx.chgPct))+'%</span>'
      + '<span class="small dim">'+esc(idx.name)+(s.synthesized?' · 等权合成':'')+'</span></div>');
    h.push('<div class="metrics">');
    h.push('<div class="metric"><span class="k">近5日</span><span class="v '+tone(s.chg5)+'">'+(sg(s.chg5))+'%</span></div>');
    h.push('<div class="metric"><span class="k">近20日</span><span class="v '+tone(s.chg20)+'">'+(sg(s.chg20))+'%</span></div>');
    h.push('<div class="metric"><span class="k">涨跌家数</span><span class="v">'+s.breadth.up+'涨'+s.breadth.down+'跌</span></div>');
    h.push('<div class="metric"><span class="k">距年线</span><span class="v '+tone(s.distToMa250Pct)+'">'+(sg(s.distToMa250Pct))+'%</span></div>');
    h.push('<div class="metric"><span class="k">站上年线</span><span class="v">'
      +(s.trendBreadth.ma250Total?s.trendBreadth.aboveMa250+"/"+s.trendBreadth.ma250Total:"-")+'</span></div>');
    h.push('<div class="metric"><span class="k">站上季线</span><span class="v">'
      +(s.trendBreadth.ma60Total?s.trendBreadth.aboveMa60+"/"+s.trendBreadth.ma60Total:"-")+'</span></div>');
    h.push('</div>');
    if (hk.length) {
      var hu = hk.filter(function(x){return x.chgPct>0}).length;
      var hd = hk.filter(function(x){return x.chgPct<0}).length;
      h.push('<div class="small dim" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">'
        +'港股 '+hk.length+' 只：'+hu+' 涨 '+hd+' 跌　区间口径为价格分位</div>');
    }
    h.push('</div>');

    h.push(macroHtml());
    h.push(catalystHtml());

    var stocks = all;
    h.push('<div class="card"><h2>跟踪列表 '+stocks.length+' 只</h2>');
    h.push('<div class="tabs">');
    h.push('<span class="tab'+(filter==="all"?" on":"")+'" data-filter="all">全部</span>');
    h.push('<span class="tab'+(filter==="A"?" on":"")+'" data-filter="A">A股</span>');
    h.push('<span class="tab'+(filter==="HK"?" on":"")+'" data-filter="HK">港股</span>');
    h.push('<span class="tab'+(filter==="focus"?" on":"")+'" data-filter="focus">重点</span>');
    h.push('<span class="tab'+(filter==="low"?" on":"")+'" data-filter="low">低位区</span>');
    h.push('<span class="tab'+(filter==="high"?" on":"")+'" data-filter="high">高位区</span>');
    h.push('<span class="sepline"></span>');
    h.push('<span class="tab'+(sort==="pct"?" on":"")+'" data-sort="pct">分位</span>');
    h.push('<span class="tab'+(sort==="chg"?" on":"")+'" data-sort="chg">涨幅</span>');
    h.push('<span class="tab'+(sort==="cap"?" on":"")+'" data-sort="cap">市值</span>');
    h.push('</div>');

    for (var i=0;i<stocks.length;i++){
      var x = stocks[i];
      h.push('<div class="item'+(x.isFocus?" focus":"")+'" data-key="'+x.key+'">');
      h.push('<div class="row between"><div class="row"><span class="name">'+esc(x.name)+'</span>'
        +'<span class="code">'+x.code+'</span>'
        +'<span class="mtag'+(x.isHk?" hk":"")+'">'+(x.isHk?"HK":"A")+'</span>'
        +(x.isFocus?'<span class="tagline">重点</span>':'')+'</div>'
        +'<span class="badge '+((x.status&&x.status.tone)||"na")+'">'+esc((x.status&&x.status.label)||"-")+'</span></div>');
      h.push('<div class="line2"><span class="price '+tone(x.chgPct)+'">'+px(x.price,x.market)+'</span>'
        +'<span class="'+tone(x.chgPct)+'">'+sg(x.chgPct)+'%</span>'
        +'<span class="small muted" style="margin-left:auto">分位 '+fp(x.pct)+'</span></div>');
      h.push('<div class="line3">加仓 ≤ <span class="hl">'+(x.bands?px(x.bands.addPrice,x.market):"-")+'</span>'
        +'<span class="sep">|</span>减仓 ≥ <span class="hl">'+(x.bands?px(x.bands.trimPrice,x.market):"-")+'</span>'
        +'<span class="sep">|</span>PE '+pe(x)
        +'<span class="sep">|</span>'+cap(x.totalCap)+'</div>');
      h.push('</div>');
      if (openKey === x.key) h.push(detailHtml(x));
    }
    if (!stocks.length) h.push('<div class="empty">没有符合条件的标的</div>');
    h.push('</div>');

    if (snap.industryReports && snap.industryReports.length){
      h.push('<div class="card"><h2>行业报告</h2>');
      for (var q2=0;q2<Math.min(10,snap.industryReports.length);q2++){
        var ir = snap.industryReports[q2];
        h.push('<div class="doc"><span class="dim tiny">'+ir.date+'</span> <span class="org">'+esc(ir.org)+'</span><br>'
          +'<a href="'+esc(ir.url)+'" target="_blank" rel="noopener">'+esc(ir.title)+'</a></div>');
      }
      h.push('</div>');
    }

    h.push('<div class="foot">数据来自公开接口。A 股区间由历史估值分位反推，港股由历史价格分位反推。<br>'
      +'仅作跟踪记录，不构成投资建议。'
      +'<br><span class="locklink" id="lock">锁定本设备</span></div>');

    document.getElementById("app").innerHTML = h.join("");

    var lk = document.getElementById("lock");
    if (lk) lk.addEventListener("click", function(){
      try { localStorage.removeItem(STORE_KEY); } catch(e){}
      location.reload();
    });
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-sort],[data-filter],.item");
    if (!t) return;
    if (t.dataset.sort){ sort = t.dataset.sort; render(); return; }
    if (t.dataset.filter){ filter = t.dataset.filter; render(); return; }
    if (t.dataset.key){
      openKey = (openKey === t.dataset.key) ? null : t.dataset.key;
      var k = openKey;
      render();
      if (k) {
        var el = document.querySelector('[data-key="'+k+'"]');
        if (el) el.scrollIntoView({block:"center",behavior:"smooth"});
      }
    }
  });

  render();
  }

  /* ---------- 启动 ---------- */

  if (!payload.enc) {
    gate.style.display = "none";
    appEl.style.display = "";
    start(payload.plain);
    return;
  }

  showGate("");
  var cached = null;
  try { cached = localStorage.getItem(STORE_KEY); } catch(e){}
  if (cached) unlock(cached, false);
})();
</script>
</body>
</html>
