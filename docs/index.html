<h1>还没有配置密码</h1>
<p>这一步是故意的：在设置密码之前，页面不会发布任何数据。</p>
<p>到仓库的 <code>Settings → Secrets and variables → Actions</code> 添加一个
<code>PAGE_PASSWORD</code>，然后跑一次 <code>每日任务</code>，页面就会用这个密码加密生成。</p>
<p>密码忘了不影响任何东西，换一个再跑一次就行。</p>
</div></body></html>
